<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" font-family="DejaVu Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="960" height="700" fill="#ffffff"/>

  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">Sơ đồ hàn: TI-89 Titanium ↔ ESP32-S3 Super Mini</text>
  <text x="480" y="62" text-anchor="middle" font-size="14" fill="#555">4 dây · Tip/Ring nối thẳng (hoặc 330Ω) · không diode · không công tắc</text>

  <!-- TI-89 board -->
  <rect x="40" y="90" width="300" height="420" rx="14" fill="#f3f5f8" stroke="#8a94a3" stroke-width="2"/>
  <text x="190" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">TI-89 Titanium (bên trong)</text>

  <!-- link jack -->
  <rect x="60" y="140" width="260" height="190" rx="10" fill="#ffffff" stroke="#8a94a3" stroke-width="1.5"/>
  <text x="190" y="164" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Chân jack link 2.5mm</text>
  <!-- jack drawing -->
  <rect x="80" y="182" width="70" height="22" rx="11" fill="#d9534f"/>
  <text x="115" y="198" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Tip</text>
  <rect x="80" y="232" width="70" height="22" rx="11" fill="#e8e8e8" stroke="#666"/>
  <text x="115" y="248" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="bold">Ring</text>
  <rect x="80" y="282" width="70" height="22" rx="11" fill="#333"/>
  <text x="115" y="298" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Sleeve</text>
  <text x="162" y="198" font-size="12" fill="#333">dây đỏ (data 0)</text>
  <text x="162" y="248" font-size="12" fill="#333">dây trắng (data 1)</text>
  <text x="162" y="298" font-size="12" fill="#333">GND</text>
  <circle cx="320" cy="193" r="5" fill="#d9534f"/>
  <circle cx="320" cy="243" r="5" fill="#fff" stroke="#555" stroke-width="2"/>
  <circle cx="320" cy="293" r="5" fill="#222"/>

  <!-- battery -->
  <rect x="60" y="350" width="260" height="140" rx="10" fill="#ffffff" stroke="#8a94a3" stroke-width="1.5"/>
  <text x="190" y="374" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Khoang 4 pin AAA (4.0 – 6.4V)</text>
  <g>
    <rect x="80" y="390" width="46" height="24" rx="4" fill="#f0c419" stroke="#8a6d00"/>
    <rect x="132" y="390" width="46" height="24" rx="4" fill="#f0c419" stroke="#8a6d00"/>
    <rect x="184" y="390" width="46" height="24" rx="4" fill="#f0c419" stroke="#8a6d00"/>
    <rect x="236" y="390" width="46" height="24" rx="4" fill="#f0c419" stroke="#8a6d00"/>
  </g>
  <text x="80" y="440" font-size="12" fill="#333">+ cọc pin (đầu chuỗi pin)</text>
  <text x="80" y="474" font-size="12" fill="#333">− cọc pin (= GND, thông Sleeve)</text>
  <circle cx="320" cy="436" r="5" fill="#e67e22"/>
  <circle cx="320" cy="470" r="5" fill="#222"/>

  <!-- ESP32-S3 Super Mini -->
  <rect x="640" y="140" width="260" height="350" rx="14" fill="#1f3a5f" stroke="#0f2238" stroke-width="2"/>
  <text x="770" y="170" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">ESP32-S3 Super Mini</text>
  <rect x="725" y="182" width="90" height="26" rx="4" fill="#a8b4c4"/>
  <text x="770" y="200" text-anchor="middle" font-size="11" fill="#1a1a1a">cổng USB-C</text>
  <rect x="700" y="420" width="140" height="44" rx="4" fill="#2f5583" stroke="#7fa3cf" stroke-dasharray="4 3"/>
  <text x="770" y="439" text-anchor="middle" font-size="11" fill="#dfe8f3">ăng-ten trên mạch</text>
  <text x="770" y="455" text-anchor="middle" font-size="11" fill="#dfe8f3">tránh kim loại / lò xo pin</text>

  <!-- pads -->
  <g font-size="13" font-weight="bold">
    <rect x="628" y="221" width="24" height="24" rx="4" fill="#d4af37"/>
    <text x="662" y="238" fill="#fff">4</text>
    <text x="705" y="238" fill="#c9d6e6" font-weight="normal" font-size="12">GPIO4 (Tip)</text>
    <rect x="628" y="271" width="24" height="24" rx="4" fill="#d4af37"/>
    <text x="662" y="288" fill="#fff">5</text>
    <text x="705" y="288" fill="#c9d6e6" font-weight="normal" font-size="12">GPIO5 (Ring)</text>
    <rect x="628" y="325" width="24" height="24" rx="4" fill="#d4af37"/>
    <text x="662" y="342" fill="#fff">GND</text>
    <rect x="628" y="375" width="24" height="24" rx="4" fill="#d4af37"/>
    <text x="662" y="392" fill="#fff">5V</text>
    <text x="705" y="392" fill="#c9d6e6" font-weight="normal" font-size="12">(VBUS)</text>
  </g>

  <!-- Wires -->
  <!-- Tip -> R1 -> GPIO4 -->
  <polyline points="325,193 420,193 420,233 470,233" fill="none" stroke="#d9534f" stroke-width="4"/>
  <rect x="470" y="221" width="70" height="24" rx="4" fill="#e9d8b4" stroke="#7a5b1e" stroke-width="2"/>
  <rect x="484" y="221" width="5" height="24" fill="#8b4513"/><rect x="496" y="221" width="5" height="24" fill="#000"/><rect x="508" y="221" width="5" height="24" fill="#d9534f"/><rect x="526" y="221" width="5" height="24" fill="#d4af37"/>
  <text x="505" y="214" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">0–330Ω</text>
  <line x1="540" y1="233" x2="628" y2="233" stroke="#d9534f" stroke-width="4"/>

  <!-- Ring -> R2 -> GPIO5 -->
  <polyline points="325,243 400,243 400,283 470,283" fill="none" stroke="#9aa3ad" stroke-width="4"/>
  <rect x="470" y="271" width="70" height="24" rx="4" fill="#e9d8b4" stroke="#7a5b1e" stroke-width="2"/>
  <rect x="484" y="271" width="5" height="24" fill="#8b4513"/><rect x="496" y="271" width="5" height="24" fill="#000"/><rect x="508" y="271" width="5" height="24" fill="#d9534f"/><rect x="526" y="271" width="5" height="24" fill="#d4af37"/>
  <text x="505" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">0–330Ω</text>
  <line x1="540" y1="283" x2="628" y2="283" stroke="#9aa3ad" stroke-width="4"/>

  <!-- GND: battery − -> GND pad (Sleeve already common inside calc) -->
  <polyline points="325,470 560,470 560,337 628,337" fill="none" stroke="#222" stroke-width="4"/>
  <line x1="320" y1="298" x2="320" y2="465" stroke="#222" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="330" y="385" font-size="11" fill="#555">(đã thông sẵn</text>
  <text x="330" y="399" font-size="11" fill="#555">trong máy)</text>

  <!-- 5V: battery + -> 5V pad -->
  <polyline points="325,436 590,436 590,387 628,387" fill="none" stroke="#e67e22" stroke-width="4"/>
  <text x="390" y="428" font-size="12" fill="#b35900" font-weight="bold">nối thẳng, không diode</text>

  <!-- optional cap -->
  <g>
    <line x1="560" y1="360" x2="575" y2="360" stroke="#444" stroke-width="2"/>
    <line x1="575" y1="352" x2="575" y2="368" stroke="#444" stroke-width="2"/>
    <line x1="581" y1="352" x2="581" y2="368" stroke="#444" stroke-width="2"/>
    <line x1="581" y1="360" x2="590" y2="360" stroke="#444" stroke-width="2"/>
    <text x="458" y="364" font-size="11" fill="#555">tuỳ chọn 100µF</text>
  </g>

  <!-- legend / notes -->
  <rect x="40" y="530" width="880" height="150" rx="10" fill="#fff8e6" stroke="#e0b44c"/>
  <text x="60" y="556" font-size="14" font-weight="bold" fill="#1a1a1a">Lưu ý</text>
  <g font-size="13" fill="#333">
    <text x="60" y="580">• Rút pin AAA trước khi cắm USB-C vào ESP (không có diode). Lắp pin lại sau khi rút USB.</text>
    <text x="60" y="602">• Tip/Ring nối thẳng hoặc qua ≤330Ω. KHÔNG dùng 1kΩ trở lên: link TI-89 Titanium kéo lên mạnh, ESP không kéo xuống đủ thấp.</text>
    <text x="60" y="624">• Trước khi hàn: đo Tip/Ring so với Sleeve (máy bật, rảnh) để biết điện áp link; đo thông mạch, chắc chắn 5V không chập GND.</text>
    <text x="60" y="646">• Hàn Tip/Ring vào CHÂN JACK (không hàn vào L8/L9). Cố định dây bằng keo nến; dán Kapton dưới ESP; dây ~30 AWG.</text>
    <text x="60" y="668">• Firmware: Tip = pad 4, Ring = pad 5. Hàn ngược thì đặt SWAP_TIP_RING = 1, khỏi hàn lại.</text>
  </g>
</svg>
